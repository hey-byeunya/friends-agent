# staging 브랜치에 푸시되면 staging 에, main 에 푸시되면 승인을 거쳐 production 에 배포한다. 배포 전에 ci.yml 검사를 먼저 돌린다.
# Actions 안에서 Dockerfile로 이미지를 만들고, 커밋 번호를 태그로 붙여 Artifact Registry에 올린 뒤 그 이미지로 배포한다.
#   GitHub 저장소 Settings > Environments 에 staging, production 환경을 만들고,
#   production 에는 Required reviewers(배포 승인자)를 건다.
#   환경마다 Variables 에 SERVICE(friend-agent-staging / friend-agent), ENV(staging / production) 를 넣는다.
#   저장소 공통 Variables: GCP_PROJECT_ID, WIF_PROVIDER, DEPLOY_SA, RUNTIME_SA, AR_REPO(us-central1-docker.pkg.dev/<프로젝트 ID>/friend-agent)
# 배포용 이미지는 여기서만 만든다. 노트북에서 만든 이미지는 CPU 종류가 다를 수 있고, 누가 언제 만들었는지 기록이 남지 않는다.
name: deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      IMAGE: ${{ vars.AR_REPO }}/friend-agent:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: 이미지 만들기와 올리기
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE }}
          region: us-central1
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: ${{ env.IMAGE }}
          env_vars: |
            COMMIT_SHA=${{ github.sha }}
            ENV=${{ vars.ENV }}
          flags: --service-account=${{ vars.RUNTIME_SA }}

      - name: 배포 결과
        run: |
          echo "배포된 주소 ${{ steps.deploy.outputs.url }}"
          echo "배포한 이미지 $IMAGE"

      - name: 배포 결과 알림
        if: always()  # 앞 단계가 실패해도 결과를 알린다
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          ENV_NAME: ${{ vars.ENV }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "DEPLOY_WEBHOOK_URL 시크릿이 없어 알림을 건너뜀"; exit 0; fi
          if [ "$STATUS" = "success" ]; then ICON=":white_check_mark:"; else ICON=":x:"; fi
          TEXT="$ICON 배포 $STATUS | 환경 $ENV_NAME | 커밋 ${SHA:0:7} | $RUN_URL"
          curl -sS -f -X POST -H "Content-Type: application/json" --data "$(jq -n --arg text "$TEXT" '{text: $text}')" "$WEBHOOK_URL"
