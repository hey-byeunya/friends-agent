# staging 브랜치에 푸시되면 staging 에, main 에 푸시되면 승인을 거쳐 production 에 배포한다. 배포 전에 ci.yml 검사를 먼저 돌린다.
# 사용법: ci.yml 과 함께 .github/workflows/ 에 복사하고, 기존 deploy.yml 은 지운다.
#   GitHub 저장소 Settings > Environments 에 staging, production 환경을 만들고,
#   production 에는 Required reviewers(배포 승인자)를 건다.
#   환경마다 Variables 에 SERVICE(friend-agent-staging / friend-agent), ENV(staging / production) 를 넣는다.
#   저장소 공통 Variables: GCP_PROJECT_ID, WIF_PROVIDER, DEPLOY_SA, RUNTIME_SA, BUILD_SA
name: deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE }}
          region: us-central1
          project_id: ${{ vars.GCP_PROJECT_ID }}
          source: .
          env_vars: |
            COMMIT_SHA=${{ github.sha }}
            ENV=${{ vars.ENV }}
          flags: --service-account=${{ vars.RUNTIME_SA }} --build-service-account=projects/${{ vars.GCP_PROJECT_ID }}/serviceAccounts/${{ vars.BUILD_SA }} --clear-base-image

      - name: 배포 주소
        run: echo "배포된 주소 ${{ steps.deploy.outputs.url }}"

      - name: 배포 결과 알림
        if: always()  # 앞 단계가 실패해도 결과를 알린다
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          ENV_NAME: ${{ vars.ENV }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "DEPLOY_WEBHOOK_URL 시크릿이 없어 알림을 건너뜀"; exit 0; fi
          if [ "$STATUS" = "success" ]; then ICON=":white_check_mark:"; else ICON=":x:"; fi
          TEXT="$ICON 배포 $STATUS | 환경 $ENV_NAME | 커밋 ${SHA:0:7} | $RUN_URL"
          curl -sS -f -X POST -H "Content-Type: application/json" --data "$(jq -n --arg text "$TEXT" '{text: $text}')" "$WEBHOOK_URL"
