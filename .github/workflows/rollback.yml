# production 트래픽 100%를 입력한 리비전으로 되돌리는 원클릭 롤백.
# Actions 탭 > rollback > Run workflow 에서 되돌아갈 리비전 이름을 넣고 실행한다.
# 되돌아갈 리비전은 배포 실행 로그의 "전환 전 리비전" 줄에 있다.
# 이미지를 다시 만들지 않고 트래픽 설정만 바꾼다. production 승인을 거친다.
name: rollback

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "되돌아갈 리비전 이름 (예: friend-agent-00024-jd2)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVICE: ${{ vars.SERVICE }}
      REVISION: ${{ inputs.revision }}  # 입력값은 run 안에 직접 끼워 넣지 않고 환경 변수로만 쓴다
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # 1. 입력한 리비전이 이 서비스의 것인지 확인하고, 지금 트래픽을 받는 리비전을 남긴다
      - name: 되돌아갈 리비전 확인
        run: |
          OWNER=$(gcloud run revisions describe "$REVISION" --region us-central1 --format 'value(metadata.labels."serving.knative.dev/service")' || true)
          if [ "$OWNER" != "$SERVICE" ]; then echo "::error::$REVISION 은 $SERVICE 서비스의 리비전이 아니다"; exit 1; fi
          NOW=$(gcloud run services describe "$SERVICE" --region us-central1 --format json | jq -r '.status.traffic | max_by(.percent) | .revisionName')
          echo "지금 트래픽을 받는 리비전 $NOW"
          echo "되돌아갈 리비전 $REVISION"

      # 2. 트래픽 100%를 입력한 리비전으로 옮긴다
      - name: 트래픽 옮기기
        run: gcloud run services update-traffic "$SERVICE" --region us-central1 --to-revisions "$REVISION=100"

      # 3. 서비스 주소의 /version 이 그 리비전으로 답하는지 본다. 쉬던 리비전은 첫 응답이 늦을 수 있어 몇 번 다시 묻는다
      - name: /version 확인
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region us-central1 --format 'value(status.url)')
          for i in $(seq 1 10); do
            BODY=$(curl -s --max-time 5 "$URL/version" || true)
            echo "시도 $i/10: $BODY"
            if [ "$(echo "$BODY" | jq -r '.revision // empty' 2>/dev/null)" = "$REVISION" ]; then exit 0; fi
            sleep 3
          done
          echo "::error::서비스 주소가 $REVISION 으로 답하지 않는다"
          exit 1
